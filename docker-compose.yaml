# The whole system: one PostgreSQL database (schemas event_store and read_model) and the
# inventory API, which appends events and updates the read model in one transaction.
# One-shot init services migrate the schemas and then create the restricted roles.
#
#   docker compose up -d --build     everything (see README "Run with Docker")
#   make up                          PostgreSQL only, for running Go on the host
#   docker compose --profile tools run --rm --no-deps rebuild  rebuild the read model from the event store
#
# Configuration and secrets come from .env (see .env.example); none are baked into the
# image. Every published port is bound to 127.0.0.1 only.
name: keyloop

# api and rebuild reuse the image built for migrate (the first app service started).
x-inventory-app: &inventory-app
  image: localhost/keyloop-inventory:local
  pull_policy: never

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_read}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 40

  # --- one-shot initialisation (idempotent; safe to re-run) -------------------------

  # Schema owner: the only service that uses the image-created superuser for the app.
  migrate:
    <<: *inventory-app
    build:
      context: .
    command: ["migrate"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-inventory_read}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Restricted roles (deploy/postgres): the application writer (append-only es_event,
  # read-model DML, no DDL), the read-only query role and the rebuild role (TRUNCATE of
  # the read model, SELECT on es_event). None is a superuser.
  postgres-grants:
    image: docker.io/library/postgres:17
    entrypoint: ["sh", "-c"]
    # Names and passwords are substituted into SQL text run by the superuser, so names
    # must be plain lower-case identifiers and passwords letters and digits (no quoting
    # or injection issues); empty values are refused.
    command:
      - |
        set -e
        for n in "$$POSTGRES_DB" "$$POSTGRES_APP_USER" "$$POSTGRES_READER_USER" "$$POSTGRES_REBUILD_USER"; do
          case "$$n" in ""|[!a-z_]*|*[!a-z0-9_]*) echo "database and role names must be lower-case identifiers" >&2; exit 1;; esac
        done
        for p in "$$POSTGRES_APP_PASSWORD" "$$POSTGRES_READER_PASSWORD" "$$POSTGRES_REBUILD_PASSWORD"; do
          case "$$p" in ""|*[!A-Za-z0-9]*) echo "passwords must be non-empty letters and digits" >&2; exit 1;; esac
        done
        apply() {
          sed -e "s/{{database}}/$$POSTGRES_DB/g" -e "s/{{$$2_user}}/$$3/g" -e "s/{{$$2_password}}/$$4/g" "/deploy/postgres/$$1" \
            | psql -v ON_ERROR_STOP=1 -q -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
        }
        apply app-grants.sql app "$$POSTGRES_APP_USER" "$$POSTGRES_APP_PASSWORD"
        apply grants.sql reader "$$POSTGRES_READER_USER" "$$POSTGRES_READER_PASSWORD"
        apply rebuild-grants.sql rebuild "$$POSTGRES_REBUILD_USER" "$$POSTGRES_REBUILD_PASSWORD"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_read}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-inventory_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER:-inventory_reader}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?set POSTGRES_READER_PASSWORD in .env}
      POSTGRES_REBUILD_USER: ${POSTGRES_REBUILD_USER:-inventory_rebuild}
      POSTGRES_REBUILD_PASSWORD: ${POSTGRES_REBUILD_PASSWORD:?set POSTGRES_REBUILD_PASSWORD in .env}
    volumes:
      - ./deploy:/deploy:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # --- application --------------------------------------------------------------------

  api:
    <<: *inventory-app
    command: ["api"]
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-inventory_read}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-inventory_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER:-inventory_reader}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?set POSTGRES_READER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/inventory", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres-grants:
        condition: service_completed_successfully
    restart: unless-stopped
    # SIGTERM lets in-flight requests finish (up to 10 s, see cmd/http_server.go).
    stop_grace_period: 20s

  # Recovery tool, not started by `up`: `docker compose --profile tools run --rm --no-deps rebuild`.
  rebuild:
    <<: *inventory-app
    profiles: ["tools"]
    command: ["rebuild-projections"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-inventory_read}
      POSTGRES_REBUILD_USER: ${POSTGRES_REBUILD_USER:-inventory_rebuild}
      POSTGRES_REBUILD_PASSWORD: ${POSTGRES_REBUILD_PASSWORD:?set POSTGRES_REBUILD_PASSWORD in .env}
    depends_on:
      postgres-grants:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres-data:
