# Local infrastructure: MySQL event store (write side), PostgreSQL read model, and the
# change feed between them: Debezium (Kafka Connect) streams es_event from the MySQL
# binlog into Kafka (KRaft, no ZooKeeper). Configuration comes from .env (see
# .env.example). Every port is bound to 127.0.0.1 only.
name: keyloop

services:
  mysql:
    image: docker.io/library/mysql:8.4
    command:
      # Binary log settings required by Debezium (ROW format is the 8.4 default). The
      # binlog must outlive any connector downtime, or the connector re-snapshots.
      - --server-id=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=259200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env (see .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inventory}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_read}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 40

  # Single-node KRaft broker (combined broker + controller). INTERNAL is used inside
  # the Compose network (Kafka Connect), HOST by the projector on the host.
  kafka:
    image: docker.io/apache/kafka:4.3.1
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-AORBiTG5Tj6Quvb_RpDJ9A}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly: the change-feed topic by the connector
      # (topic.creation.*), Connect's internal topics by Connect.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Kafka Connect with the Debezium MySQL connector. Its configuration, offsets and
  # status live in Kafka topics; the connector is registered by `make connector`.
  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: inventory-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Connector configs reference ${env:DEBEZIUM_MYSQL_PASSWORD}: the secret is never
      # stored in the connector config topic or returned by the REST API.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      # Not `:?`: Compose resolves the whole file, and `make up` (MySQL + PostgreSQL
      # only) must work without it. `make cdc-up` checks it instead.
      DEBEZIUM_MYSQL_PASSWORD: ${DEBEZIUM_MYSQL_PASSWORD:-}
    ports:
      - "127.0.0.1:${CONNECT_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  mysql-data:
  postgres-data:
  kafka-data:
